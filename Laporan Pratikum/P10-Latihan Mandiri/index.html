<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Suhu - Percobaan 10</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">Percobaan 10: Latihan Mandiri</p>
            <h1>Kalkulator Konversi Suhu</h1>
            <p>Masukkan suhu dalam skala Celsius untuk melihat hasil konversinya.</p>
        </header>

        <section class="panel">
            <!-- Form Input -->
            <form id="formSuhu">
                <label for="celsius">Suhu (Celsius)</label>
                <input type="number" id="celsius" value="25" required>
                <button type="submit">Konversi Suhu</button>
            </form>

            <!-- Tempat Output -->
            <article id="hasil" class="result">
                <h2>Hasil Konversi</h2>
                <div id="output">
                    <p>Klik tombol konversi untuk melihat hasil.</p>
                </div>
            </article>
        </section>
        
    </main>

    <!-- UBAH BAGIAN INI UNTUK LAPORAN (suhu_bug.js / suhu_fix.js) -->
    <script src="script.js"></script>
</body>
</html>
